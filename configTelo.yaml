# =====================================================================
# CONFIGURACIÓ UNIFICADA TELÓ (Auto & Manual)
# =====================================================================

# ---------------------------------------------------------------------
# 1. SECCIÓ COMÚ (Compartida per teloAuto i teloManual)
# ---------------------------------------------------------------------
common:
  # Servidor Web Intern (Flask / Socket.IO)
  server:
    host: "0.0.0.0"
    port: 5000

  # Llista d'idiomes disponibles al sistema
  languages:
    ca: "Català"
    es: "Español"
    fr: "Français"
    en: "English"
    de: "Deutsch"
    it: "Italiano"

  # Estils generals de la interfície d'usuari (Consola de control)
  interface:
    title: "TELÓ 🎭"
    colors:
      background: "#121212"
      text: "#E0E0E0"
      primary: "#00E676"        # Verd destacat
      secondary: "#29B6F6"      # Blau secundari
      panel_bg: "#1E1E1E"
      button_bg: "#252525"
      button_border: "#444444"

  # --- ESTILS INDEPENDENTS PER CANAL DE SORTIDA ---
  styles:
    hdmi:
      title: "Projector HDMI"
      font_family: "Arial"
      font_size: 38
      font_color: "#FFFFFF"
      background_color: "#000000"
      font_weight: "bold"
      max_lines: 3
      width: 1000
      height: 400
      alignment: "center"        # 'left', 'center', 'right'

    web:
      font_family: "Arial"
      font_size: "2.5rem"
      font_color: "#FFFFFF"
      background_color: "#000000"

    glasses:
      font_family: "Courier New"
      font_size: "2.8rem"
      font_color: "#00FF66"
      background_color: "#000000"


# ---------------------------------------------------------------------
# 2. SECCIÓ MANUAL (Específica per a teloManual)
# ---------------------------------------------------------------------
manual:
  # Estils de la caixa de previsualització de subtítols de la pantalla de control
  subtitols_previsualitzacio:
    font_family: "Arial"
    font_size: 15
    color_text: "#FFFFFF"
    color_fons: "#1A1A1A"
    color_borda: "#00E676"

  # Idioma per defecte seleccionat com a guia per a l'operador
  default_guide_language: "CAT"


# ---------------------------------------------------------------------
# 3. SECCIÓ AUTO (Específica per a teloAuto)
# ---------------------------------------------------------------------
auto:
  # Motor de reconeixement de veu (Whisper LiveKit)
  whisper_live:
    host: "localhost"
    port: 8000
    endpoint: "/asr"

  # Entramat i captura d'àudio
  audio:
    samplerate: 16000
    block_ms: 100
    device: null               # null utilitza el micròfon per defecte del sistema

  # Traducció automàtica
  translation:
    enabled: true
    target_language: "es"       # Idioma de destí per defecte (es, en, de, fr, etc.)

  # Canal de visualització inicial al projector HDMI
  projector_display_channel: "both"  # 'original', 'translation' o 'both'
