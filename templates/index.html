<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELÓ - Subtítols ({{ label }})</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            {% if is_glasses %}
                background-color: {{ web_cfg.ulleres.background_color }};
                color: {{ web_cfg.ulleres.font_color }};
                font-family: {{ web_cfg.ulleres.font_family }};
                font-size: {{ web_cfg.ulleres.font_size }};
            {% else %}
                background-color: {{ web_cfg.normal.background_color }};
                color: {{ web_cfg.normal.font_color }};
                font-family: {{ web_cfg.normal.font_family }};
                font-size: {{ web_cfg.normal.font_size }};
            {% endif %}
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Barra de controls superiors per a l'usuari */
        .user-controls {
            position: fixed;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
            background: rgba(30, 30, 30, 0.85);
            padding: 6px 12px;
            border-radius: 20px;
            z-index: 1000;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        }

        .user-controls a, .user-controls button, .user-controls select, .user-controls label {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 14px;
            padding: 4px 10px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            height: 32px;
            box-sizing: border-box;
        }

        .user-controls button.btn-icon {
            border-radius: 50%;
            width: 32px;
            height: 32px;
            padding: 0;
        }

        /* Selectors de color amagats associats als botons */
        .color-picker-input {
            display: none;
        }

        .user-controls a:hover, .user-controls button:hover, .user-controls select:hover, .user-controls label:hover {
            background: #444;
            border-color: #00E676;
        }

        #subtitle-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <!-- Controls d'usuari directes a la web -->
    <div class="user-controls">
        <a href="/" title="Tornar al Lobby">🏠 Lobby</a>
        
        {% if is_glasses %}
            <a href="/{{ lang }}" title="Canviar a Vista Normal">📱 Normal</a>
        {% else %}
            <a href="/ulleres/{{ lang }}" title="Canviar a Mode Ulleres">👓 Ulleres</a>
        {% endif %}

        <!-- Selector de Font de Lletra -->
        <select id="fontSelect" onchange="changeFontFamily(this.value)" title="Tipus de lletra">
            <option value="Arial, sans-serif">Arial</option>
            <option value="'Courier New', monospace">Courier</option>
            <option value="Verdana, sans-serif">Verdana</option>
            <option value="'Times New Roman', serif">Times</option>
            <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
        </select>

        <!-- Selector de Color del Text -->
        <label for="textColorPicker" title="Color del Text">🎨 Text</label>
        <input type="color" id="textColorPicker" class="color-picker-input" onchange="changeTextColor(this.value)">

        <!-- Selector de Color de Fons -->
        <label for="bgColorPicker" title="Color de Fons">⬛ Fons</label>
        <input type="color" id="bgColorPicker" class="color-picker-input" onchange="changeBgColor(this.value)">

        <!-- Ajustos de Mida -->
        <button class="btn-icon" onclick="changeFontSize(0.2)" title="Augmentar lletra">A+</button>
        <button class="btn-icon" onclick="changeFontSize(-0.2)" title="Reduir lletra">A-</button>
    </div>

    <div id="subtitle-container">Esperant subtítols...</div>

    <script>
        const socket = io();
        const room = "{{ lang }}";
        const container = document.getElementById('subtitle-container');

        socket.on('connect', () => {
            socket.emit('join', { lang: room });
        });

        socket.on('nou_subtitol', (data) => {
            if (data.text !== undefined) {
                container.innerText = data.text;
            }
        });

        // 1. Canviar Font de Lletra
        function changeFontFamily(font) {
            document.body.style.fontFamily = font;
        }

        // 2. Canviar Color de Text
        function changeTextColor(color) {
            document.body.style.color = color;
        }

        // 3. Canviar Color de Fons
        function changeBgColor(color) {
            document.body.style.backgroundColor = color;
        }

        // 4. Ajust de mida de lletra
        let defaultSizeStr = "{% if is_glasses %}{{ web_cfg.ulleres.font_size }}{% else %}{{ web_cfg.normal.font_size }}{% endif %}";
        let currentSize = parseFloat(defaultSizeStr) || 2.5;

        function changeFontSize(delta) {
            currentSize = Math.max(1.0, currentSize + delta);
            document.body.style.fontSize = currentSize + 'rem';
        }

        // Inicialitzar valors dels selectors de color segons l'estil inicial
        window.addEventListener('DOMContentLoaded', () => {
            const computedStyle = getComputedStyle(document.body);
            
            // Establir la font seleccionada si coincideix
            const fontSelect = document.getElementById('fontSelect');
            const currentFont = computedStyle.fontFamily.replace(/"/g, "'");
            for (let option of fontSelect.options) {
                if (currentFont.includes(option.value.split(',')[0].replace(/'/g, ''))) {
                    fontSelect.value = option.value;
                    break;
                }
            }
        });
    </script>
</body>
</html>
